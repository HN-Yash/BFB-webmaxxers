<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Verification Node</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div id="toast-container"></div>

    <div class="perspective-wrapper">
        <div class="container" id="glass-card">
            
            
            <div class="title-wrapper">
                <!-- Logo & Title Section -->
            <div class="title-wrapper">
                <svg class="main-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  
                    <polygon points="34,50 19,83 32,77 43,53" fill="#2f7a44" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="43,53 32,77 42,88 49,56" fill="#1b4e2b" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />

                    <!-- Right Ribbon: Closer to center, slightly longer (Mirrored) -->
                    <polygon points="51,56 58,88 68,77 57,53" fill="#1b4e2b" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="57,53 68,77 81,83 66,50" fill="#2f7a44" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    
                    <!-- Scalloped Rosette (12-point) -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" fill="#ffffff" stroke="#1e5e39" stroke-width="7" stroke-linejoin="round" />
                    <!-- Left & Right Ribbons remain here above -->
                    
                    <!-- INSERT THIS: White Gap Contour (masks a ~3px gap over the ribbons) -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" 
                             fill="#ffffff" 
                             stroke="#ffffff" 
                             stroke-width="10" 
                             stroke-linejoin="round" />

                    <!-- Scalloped Rosette (Your existing green line sits on top) -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" 
                             fill="#ffffff" 
                             stroke="#1e5e39" 
                             stroke-width="7" 
                             stroke-linejoin="round" />
                    
                    <!-- Center Checkmark -->
                    <path class="draw-tick" d="M 40 42 L 46 48.5 L 60 33" stroke="#1e5e39" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>
                
            </div>
                <h2>Zero-Document<br>Verification Node</h2>
            </div>
             <p class="subtitle">Get Verified. Skip the paperwork</p>

            <!-- Verification Mode toggle -->
            <div class="toggle-container">
            <button class="toggle-btn active" id="tab_otp">Remote (OTP)</button>
            <button class="toggle-btn" id="tab_pin">In-Person (PIN)</button>
        </div>

            <!-- ID Input area -->
           <!-- Mode 1: Remote OTP Flow -->
        <div class="input-section" id="mode_otp">
            <label class="input-label">Enter Student APAAR ID</label>
            <div class="search-bar-wrapper">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="apaarInput" value="APAAR1001" placeholder="APAAR ID">
                <!-- Linked to requestOTP() -->
                <button class="action-btn" id="send_otp_btn" onclick="requestOTP()">Send OTP</button>
            </div>

            <!-- OTP Entry Area (Hidden until Send OTP is clicked) -->
            <div id="otp_entry_area" style="display: none; margin-top: 20px;">
                <label class="input-label">Enter OTP from Email</label>
                <div class="search-bar-wrapper">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    <input type="text" id="otpInput" placeholder="e.g. 123456">
                    <!-- Linked to testRemoteVerification() -->
                    <button class="action-btn" onclick="testRemoteVerification()" style="background-color: #059669;">Verify</button>
                </div>
            </div>
        </div>

        <!-- Mode 2: In-Person (PIN) Flow -->
        <div class="input-section" id="mode_pin" style="display: none;">
            <label class="input-label">Student Pin</label>
            <div class="search-bar-wrapper" style="margin-bottom: 16px;">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
                <input type="password" id="pinInput" value="987654" placeholder="6-digit PIN">
                <!-- Linked to testSSIVerification() -->
                <button class="action-btn" onclick="testSSIVerification()">Unlock</button>
            </div>

            <!-- Granular Consent Checkboxes -->
            <div style="background: rgba(255,255,255,0.6); padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1;">
                <p class="input-label" style="margin-bottom: 10px; font-size: 12px;">Granular Consent Permissions:</p>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #0f172a; margin-bottom: 8px; cursor: pointer;">
                    <input type="checkbox" id="checkCore" checked style="width: 16px; height: 16px;"> 
                    Core Identity (Name, DOB, State)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #0f172a; cursor: pointer;">
                    <input type="checkbox" id="checkAcademic" checked style="width: 16px; height: 16px;"> 
                    Academic Credentials Ledger
                </label>
            </div>
        </div>

        <!-- Result Card (Hidden by default until API success) -->
        <div id="result_card" class="result-card" style="display: none;">
            
            <div class="result-header">
                <div class="verified-status">
                    <svg class="status-icon" id="tick" viewBox="0 0 20 20" fill="#10b981">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    <span id="card-title">Identity & Records Verified</span>
                </div>
                <!-- Large Green Ribbon Badge -->
                <svg class="main-logo" id="card" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <!-- Left Ribbon: Extends along normal vector (~115° radial) -->
                   <!-- Left Ribbon: Shorter and wider -->
                  <!-- Left Ribbon: Closer to center, slightly longer -->
                    <polygon points="34,50 19,83 32,77 43,53" fill="#2f7a44" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="43,53 32,77 42,88 49,56" fill="#1b4e2b" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />

                    <!-- Right Ribbon: Closer to center, slightly longer (Mirrored) -->
                    <polygon points="51,56 58,88 68,77 57,53" fill="#1b4e2b" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="57,53 68,77 81,83 66,50" fill="#2f7a44" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    
                    <!-- Scalloped Rosette (12-point) -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" fill="#ffffff" stroke="#1e5e39" stroke-width="7" stroke-linejoin="round" />
                    <!-- Left & Right Ribbons remain here above -->
                    
                    <!-- INSERT THIS: White Gap Contour (masks a ~3px gap over the ribbons) -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" 
                             fill="#ffffff" 
                             stroke="#ffffff" 
                             stroke-width="10" 
                             stroke-linejoin="round" />

                    <!-- Scalloped Rosette (Your existing green line sits on top) -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" 
                             fill="#ffffff" 
                             stroke="#1e5e39" 
                             stroke-width="7" 
                             stroke-linejoin="round" />
                    
                    <!-- Center Checkmark -->
                    <path d="M 40 42 L 46 48.5 L 60 33" stroke="#1e5e39" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>
            </div>

            <div class="profile-section">
                <!-- IDs added here so JS can inject the real API data -->
                <img src="https://via.placeholder.com/150" alt="Student Photo" class="profile-img" id="student_photo">
                <div class="profile-details">
                    <h3 id="student_name">Student Name</h3>
                    <p id="student_dob">DOB: YYYY-MM-DD</p>
                </div>
            </div>

<div id="credential_filter_section" style="margin-bottom: 16px;">
    <label class="data-label" style="display: block; margin-bottom: 8px;">Filter Records By Category</label>
    <select id="category_dropdown" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1b5e20; background: #ffffff; color: #0f172a; font-size: 15px; outline: none; cursor: pointer;">
        <option value="All">All Verified Records</option>
    </select>
</div>


<div class="data-grid">
    <!-- The JavaScript will spawn the credential boxes inside this container -->
    <div id="dynamic_credentials" style="display: contents;"></div>    
    <!-- The Parents box remains hardcoded at the bottom as a full-width element -->
    <div class="data-box full-width">
        <div class="data-label">PARENTS</div>
        <div class="data-value" id="student_parents">Restricted Access</div>
    </div>
</div>
<!-- Return / Verify Another Button -->
            <button class="return-btn" id="btn_back" onclick="resetToPreviousMenu()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span>Verify Another Student</span>
            </button>
            
        </div>
    </div>

    <!-- Link your logic file -->
    <script src="script.js"></script>
</body>
