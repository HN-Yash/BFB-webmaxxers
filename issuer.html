<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Issuance Portal</title>
    <style>
        /* Base Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Authority Gate Box */
.auth-gate {
    background: #f8fafc;
    border: 1px dashed #94a3b8;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
}

.auth-gate-row {
    display: flex;
    gap: 10px;
}

        /* Solid Canvas Background */
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
            min-height: 100vh;
            background-color: #eef2f6;
            color: #0f172a;
        }

        .perspective-wrapper {
            width: 100%;
            max-width: 570px;
        }

        /* Solid White Container Card (No Glassmorphism) */
        .container {
            background-color: #ffffff;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            position: relative;
        }
        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 24px;
        }

        .portal-logo {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
        }

        .title-wrapper h2 {
            margin: 0;
    padding: 0;
    line-height: 1.15;
    font-size: 40px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.5px;
    transform: translateY(-12px);
        }

        .portal-subtitle {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #475569;
            margin-top: 4px;
        }
        /* Form Inputs */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        input, select {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 16px;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        /* Mint Green Verification Badge */
        .verification-badge {
            display: none;
            background-color: #e8f5ec;
            border: 1px solid #bce3c8;
            color: #1b5e20;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 8px;
            animation: slideDown 0.2s ease-out forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .draw-tick {
    stroke-dasharray: 32;
    stroke-dashoffset: 32;
    
    transform-box: fill-box;
    transform-origin: center;
    
    /* 3.8s loop with snappy modern easing */
    animation: modernTickLoop 3.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}

@keyframes modernTickLoop {
    0%, 10% {
        stroke-dashoffset: 32;
        opacity: 0;
        transform: scale(0.94);
        filter: drop-shadow(0 0 0 rgba(30, 94, 57, 0));
    }
    14% {
        opacity: 1;
        transform: scale(0.96);
    }
    /* Stroke completes: snappy pen flick + elastic pop + emerald bloom */
    28% {
        stroke-dashoffset: 0;
        transform: scale(1.07);
        filter: drop-shadow(0 2px 8px rgba(30, 94, 57, 0.45));
    }
    /* Settles naturally into resting position */
    36% {
        stroke-dashoffset: 0;
        transform: scale(1);
        filter: drop-shadow(0 0 0 rgba(30, 94, 57, 0));
    }
    /* Holds clean and stationary */
    78% {
        opacity: 1;
        stroke-dashoffset: 0;
        transform: scale(1);
    }
    /* Subtle dissolve out */
    88% {
        opacity: 0;
        stroke-dashoffset: 0;
        transform: scale(0.96);
    }
    100% {
        stroke-dashoffset: 32;
        opacity: 0;
        transform: scale(0.94);
    }
}
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="perspective-wrapper">
        <div class="container">
            <!-- Header and form content will go here -->
             <div class="title-wrapper">
                <svg class="portal-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dual-Faceted Ribbons -->
                    <polygon points="34,50 19,83 32,77 43,53" fill="#2f7a44" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="43,53 32,77 42,88 49,56" fill="#1b4e2b" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="51,56 58,88 68,77 57,53" fill="#1b4e2b" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    <polygon points="57,53 68,77 81,83 66,50" fill="#2f7a44" stroke="#13381e" stroke-width="0" stroke-linejoin="round" />
                    
                    <!-- White Gap Mask -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" 
                             fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />

                    <!-- 12-Point Rosette Body -->
                    <polygon points="50,10 56.5,15.8 65,14 67.7,22.3 76,25 74.2,33.5 80,40 74.2,46.5 76,55 67.7,57.7 65,66 56.5,64.2 50,70 43.5,64.2 35,66 32.3,57.7 24,55 25.8,46.5 20,40 25.8,33.5 24,25 32.3,22.3 35,14 43.5,15.8" 
                             fill="#ffffff" stroke="#1e5e39" stroke-width="7" stroke-linejoin="round" />
                    
                    <!-- Center Checkmark -->
                    <path d="M 40 42 L 46 48.5 L 60 33" class="draw-tick" stroke="#1e5e39" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>

                <div>
                    <h2>Zero-Document<br>Verification Node</h2>
                    
                </div>
                
            </div>
            <!-- Form Input Fields -->
            <!-- Authority Key Login -->
<div class="auth-gate">
    <label class="input-label">Authority Node Token / Key</label>
    <div class="auth-gate-row">
        <input type="password" id="authority_key_input" placeholder="e.g., AUTH_KEY_NTA_9921" style="font-family: monospace;">
        <button type="button" class="action-btn" id="verify_node_btn" style="width: auto; padding: 0 20px; margin-top: 0; white-space: nowrap; border-radius: 12px;">Verify Node</button>
    </div>
</div>

            <div class="input-group">
                <label class="input-label">Student APAAR ID</label>
                <input type="text" id="student_id_input" placeholder="e.g., APAAR1001" oninput="lookupStudentName()">
                <div id="name_preview_badge" class="verification-badge"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Credential Title</label>
                <input type="text" id="cred_name_input" placeholder="e.g., JEE ADVANCED RANK">
            </div>

            <div class="input-group">
                <label class="input-label">Credential Value</label>
                <input type="text" id="cred_val_input" placeholder="e.g., AIR 142">
            </div>
        </div>
    </div>

</body>
</html>
